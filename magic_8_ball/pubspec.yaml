name: magic_8_ball
description: A Flutter app simulating a Magic 8 Ball fortune teller.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/8.jpg
    - assets/ask_again_later.jpg
    - assets/i_have_no_idea.jpg
    - assets/no.jpg
    - assets/the_answer_is_yes.jpg
    - assets/yes.jpg
